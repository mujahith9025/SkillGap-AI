name: SkillGap AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: SkillGap_AI

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"
        cache-dependency-path: SkillGap_AI/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Verify Environment Setup
      run: |
        python src/verify_setup.py

    - name: Run Complete 114 Test Suite
      run: |
        python -m pytest src/ -v

    - name: Run Quantitative System Evaluation Benchmark
      run: |
        python -u src/system_evaluation.py
